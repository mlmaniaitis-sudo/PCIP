version: '3.8'
services:
  db:
    image: timescale/timescaledb-postgis:latest-pg13
    container_name: pcip_db
    environment:
      POSTGRES_USER: pcip_user
      POSTGRES_PASSWORD: pcip_password
      POSTGRES_DB: pcip_db
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcip_user -d pcip_db"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  pgdata: